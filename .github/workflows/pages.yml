name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WORKSPACE: docs/architecture/workspace.dsl
  SITE_GENERATR_IMAGE: ghcr.io/avisi-cloud/structurizr-site-generatr:1.6.0
  SITE_DIR: build/site

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Structurizr site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate site
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/var/model" \
            "$SITE_GENERATR_IMAGE" \
            generate-site \
              --workspace-file "$WORKSPACE" \
              --default-branch main \
              --output-dir "$SITE_DIR"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
