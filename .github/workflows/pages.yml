name: pages

# Builds two static sites and deploys them together, as one GitHub Pages artifact:
# the Structurizr site (C4 views) at the root and the log4brains site (ADRs) under
# /adr/. See README.md, "How the CI works".

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WORKSPACE: docs/architecture/workspace.dsl
  SITE_GENERATR_IMAGE: ghcr.io/avisi-cloud/structurizr-site-generatr:1.6.0
  SITE_DIR: build/site
  ADR_DIR: docs/architecture/decisions
  ADR_INDEX: docs/architecture/adr-index.md   # home page of the log4brains site
  SCRIPTS_DIR: .github/scripts
  NODE_VERSION: "22"
  LOG4BRAINS_VERSION: 1.1.0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Structurizr and log4brains sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # log4brains reads the ADR dates and authors from git history

      - id: pages
        uses: actions/configure-pages@v5

      - name: Generate Structurizr site
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/var/model" \
            "$SITE_GENERATR_IMAGE" \
            generate-site \
              --workspace-file "$WORKSPACE" \
              --default-branch main \
              --output-dir "$SITE_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate log4brains site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # Only in this checkout, never committed: adapt the ADR format for
          # log4brains (see the script) and add the home page of the ADR site.
          "$SCRIPTS_DIR/log4brains-prepare" "$ADR_DIR"
          cp "$ADR_INDEX" "$ADR_DIR/index.md"
          npx --yes "log4brains@$LOG4BRAINS_VERSION" build \
            --basePath "$BASE_PATH/adr" \
            --out "$SITE_DIR/adr"

      - name: Redirect the old Decisions page to the ADR site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # Without !adrs the Structurizr site still writes an empty, unlinked
          # main/decisions/ page. Send old links to the log4brains site instead.
          printf '<!doctype html>\n<meta http-equiv="refresh" content="0; url=%s/adr/">\n<a href="%s/adr/">Architecture decisions</a>\n' \
            "$BASE_PATH" "$BASE_PATH" > "$SITE_DIR/main/decisions/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
